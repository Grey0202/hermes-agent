name: fallback-alert
version: "1.0.0"
description: "Optional plugin — sends a Telegram notification when Hermes activates a provider fallback. Detects mid-session that the provider/model in the post_api_request hook differs from the session's first-seen provider/model. Fork build reuses TELEGRAM_BOT_TOKEN / TELEGRAM_HOME_CHANNEL when the FALLBACK_ALERT_* overrides are unset; no-op when neither is present. Adapted from upstream PR #30359."
author: hermes-community
hooks:
  - post_api_request
